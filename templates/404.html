{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}
{% block content %}
<section class="section" style="min-height:60vh; display:flex; align-items:center; justify-content:center; text-align:center;">
  <div>
    <h1 style="font-size:6rem;" class="gradient-text">404</h1>
    <h2>Page Not Found</h2>
    <p class="section-sub">The page you're looking for doesn't exist or has been moved.</p>
    <a href="{{ url_for('index') }}" class="btn btn-gradient">Back to Home</a>
  </div>
</section>
{% endblock %}
